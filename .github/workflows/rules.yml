name: Rules test

on:
  push:
    paths: [firestore.rules, "tests/**", ".github/workflows/rules.yml"]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Rules tests
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-spartan "node rules.test.mjs" 2>&1 | tee rules.log
      - name: Post the log as a note
        if: always()
        shell: bash
        run: |
          grep -E "✗|passed|Error|error" rules.log | head -60 > short.log || true
          echo "::notice title=rules.log::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' short.log)"
